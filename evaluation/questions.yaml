# Jeu d'évaluation de la recherche documentaire.
#
# Pour chaque question : fragment(s) du nom des fichiers qui contiennent la
# réponse (insensible à la casse). Toute version d'un document est acceptée
# (brouillon, version validée, reprise d'une réunion à l'autre). Une question
# est réussie si au moins une source attendue figure parmi les passages retenus.
# Une question hors sujet (sources_attendues: []) est réussie si aucun passage
# n'est retenu.
#
# Rédigé le 2026-10-09 à partir de la lecture des documents de documents/2024.
# Types : chiffre précis, référence exacte, question de fond, contenu OCR
# (tableaux, cartes, images), courriel, hors sujet.

