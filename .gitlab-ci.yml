# Équivalent GitLab du workflow .github/workflows/tests.yml
tests:
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    ALBERT_API_KEY: "test"  # aucun appel réel : les tests simulent l'API
  cache:
    paths:
      - .cache/pip
  script:
    - pip install -r requirements.txt -r requirements-dev.txt
    - pytest -q --cov-report=term
