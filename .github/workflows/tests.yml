name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Dépendances
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests
        # Aucun appel réel à Albert : les tests simulent l'API
        env:
          ALBERT_API_KEY: test
        run: pytest -q --cov-report=term
